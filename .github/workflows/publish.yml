name: Refresh and publish Curiosity Radar

on:
  schedule:
    # 07:30 & 19:30 JST. GitHub cron is UTC and can be delayed.
    - cron: '30 22,10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curiosity-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Refresh feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Save snapshot for momentum detection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update curated feed [skip ci]'
            git push || echo 'Snapshot push not permitted. Deployment will still run.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public site (exclude source and workflow files)
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css app.js sw.js manifest.webmanifest _site/
          cp assets/*.svg _site/assets/
          cp data/news.json _site/data/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

