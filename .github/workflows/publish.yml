name: Refresh and publish Curiosity Radar

on:
  pull_request:
  schedule:
    # 07:30 & 19:30 JST. GitHub cron is UTC and can be delayed.
    - cron: '30 22,10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'

permissions: {}

concurrency:
  group: curiosity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: node --check sw.js
      - run: node --test tests/*.test.cjs
      - run: python -m json.tool data/news.json >/dev/null

  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Save snapshot for momentum detection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update curated feed [skip ci]'
            git push || echo 'Snapshot push not permitted. Deployment will still run.'
          fi
      - name: Prepare public site (exclude source and workflow files)
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css feed-status.js app.js sw.js manifest.webmanifest _site/
          cp assets/*.svg _site/assets/
          cp data/news.json _site/data/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
